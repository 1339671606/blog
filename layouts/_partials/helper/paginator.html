{{/* The home page is a landing page; pagination belongs to content lists. */}}
{{- $result := slice -}}
{{- if or (eq .Kind "section") (eq .Kind "taxonomy") (eq .Kind "term") -}}
    {{- $pages := partial "helper/pages.html" . -}}
    {{- $result = .Paginate $pages -}}
{{- end -}}
{{- return $result -}}
