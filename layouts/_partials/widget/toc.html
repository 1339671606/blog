{{/* Keep the title within the card while Stack handles numbering and scroll tracking. */}}
{{ if (.Context.Scratch.Get "TOCEnabled") }}
    <section class="widget archives toc-widget" aria-labelledby="toc-widget-title">
        <div class="widget--toc">
            <h2 class="widget-title section-title toc-widget-title" id="toc-widget-title">{{ T "article.tableOfContents" }}</h2>
            <nav class="toc-nav" id="TableOfContents" aria-labelledby="toc-widget-title">
                {{ partial "article/components/toc" .Context | safeHTML }}
            </nav>
        </div>
    </section>
{{ end }}
