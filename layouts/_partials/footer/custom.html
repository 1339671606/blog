{{- if and .IsPage (in .Site.Params.mainSections .Type) -}}
<nav class="reading-tools" aria-label="长文阅读工具" data-search-url="{{ with .Site.GetPage "/page/search" }}{{ .RelPermalink }}{{ end }}" hidden>
    <button type="button" data-reading-top aria-label="回到顶部"><span aria-hidden="true">↑</span><span>顶部</span></button>
    {{ with .GetTerms "categories" }}<button type="button" data-reading-open="notes" aria-label="打开同类笔记" aria-haspopup="dialog" aria-controls="related-notes-dialog"><span aria-hidden="true">↔</span><span>同类</span></button>{{ end }}
    {{ if .Scratch.Get "TOCEnabled" }}<button type="button" data-reading-toc aria-label="查看文章目录"><span aria-hidden="true">☷</span><span>目录</span></button>{{ end }}
</nav>
{{ partial "article/components/reading-drawers" . }}
{{- end -}}
